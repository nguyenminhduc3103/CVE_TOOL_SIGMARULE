version: 1

# Step 6 Detection Knowledge Base
# Update this file to onboard a new CVE family — do not change code.

families:
  log4shell:
    signature: log4shell
    aliases:
      - jndi_injection
      - log4j
      - log4j2
      - log4shell_rce
      - cve_2021_44228
      - "apache log4j2 jndi rce (log4shell)"
      - "apache log4j2 jndi rce"
      - "log4j2 jndi rce"
      - "log4j2 rce"
      - "log4j jndi rce"
      - "log4j rce"
    intents:
      - intent: jndi_payload_lookup
        domain_hint: http
        evidence_refs:
          - mandatory_behaviors: process_creation
        values_from:
          - kb: signatures.log4shell.payload_markers
      - intent: outbound_ldap_rmi
        domain_hint: network
        evidence_refs:
          - attack_flow.observable_side_effects
        values_from:
          - kb: signatures.log4shell.outbound_ports
    correlation:
      type: temporal_ordered
      timespan: 5m
      group_by: [process_image]
    required_markers: ["jndi:", "ldap:", "rmi:"]

  spring4shell:
    signature: spring4shell
    intents:
      - intent: classloader_exploit_request
        domain_hint: http
        evidence_refs:
          - attack_flow.observable_side_effects
        values_from:
          - kb: signatures.spring4shell.payload_markers
      - intent: post_exploit_command_execution
        domain_hint: process
        evidence_refs:
          - mandatory_behaviors: process_creation
    correlation:
      type: temporal_ordered
      timespan: 5m
      group_by: [destination_ip]
    required_markers:
      - class.module.classLoader
      - classLoader.resources.context.parent.pipeline

  printnightmare:
    signature: printnightmare
    intents:
      - intent: spoolsv_dll_load
        domain_hint: process
        evidence_refs:
          - mandatory_behaviors: process_creation
    correlation:
      type: event_count
      timespan: 5m
      group_by: [host]
    required_markers: [spoolsv.exe]

  struts_ognl:
    signature: struts_ognl
    intents:
      - intent: ognl_injection_request
        evidence_refs:
          - attack_flow.observable_side_effects
        values_from:
          - kb: signatures.struts_ognl.payload_markers
    correlation:
      type: temporal_ordered
      timespan: 5m
    required_markers: ["%{", "#context", "@java.lang"]

  apache_path_traversal:
    signature: apache_path_traversal
    intents:
      - intent: path_traversal_request
        evidence_refs:
          - attack_flow.observable_side_effects
        values_from:
          - kb: signatures.apache_path_traversal.payload_markers
    correlation:
      type: temporal_ordered
      timespan: 5m

signatures:
  log4shell.payload_markers:
    markers:
      - "jndi:"
      - "ldap:"
      - "rmi:"
      - "${${lower:j}ndi:"
      - "${${::-j}${::-n}${::-d}${::-i}:"
      - "${jndi:ldap:"
      - "${jndi:rmi:"
      - "${${upper:ı}ndi:"
      - "/${"
      - "${env:"
    sources:
      - cve_evidence
      - lab_log
      - obfuscation_corpus

  log4shell.outbound_ports:
    ports:
      - 389      # LDAP cleartext
      - 636      # LDAPS
      - 3268     # Global Catalog
      - 3269     # GC over SSL
      - 1099     # Java RMI
      - 1389     # LDAP alt
      - 1059     # IIOP (Corba)
      - 1100     # IIOP alt
      - 53       # DNS callback
    rationale: "Ports observed in Log4Shell callback channels (LDAP, RMI, IIOP, DNS)."

  spring4shell.payload_markers:
    markers:
      - "class.module.classLoader"
      - "classLoader.resources.context.parent.pipeline"
      - "class.module.classLoader.DefaultResolver"
    sources:
      - cve_evidence
      - lab_log

  struts_ognl.payload_markers:
    markers:
      - "%{"
      - "#context"
      - "@java.lang"
    sources:
      - cve_evidence

  apache_path_traversal.payload_markers:
    markers:
      - "../"
      - "..%2f"
      - "..\\"
    sources:
      - cve_evidence
      - lab_log

# ─────────────────────────────────────────────────────────────────────────────
# Intent → telemetry domain hint (resolver still authoritative)
# Used by IntentMapper when Step 4 canonical_telemetry has multiple options.
# ─────────────────────────────────────────────────────────────────────────────

behaviors:
  process_creation:
    intent: child_process_execution
    domain_hint: process
    evidence_refs:
      - mandatory_behaviors
      - attack_flow.observable_side_effects

  network_callback:
    intent: outbound_network
    domain_hint: network
    evidence_refs:
      - attack_flow.observable_side_effects

  web_request:
    intent: malicious_request
    domain_hint: http
    evidence_refs:
      - mandatory_behaviors
      - attack_flow.observable_side_effects

  file_write:
    intent: suspicious_file_drop
    domain_hint: filesystem
    evidence_refs:
      - mandatory_behaviors

  registry_event:
    intent: registry_modification
    domain_hint: registry
    evidence_refs:
      - mandatory_behaviors

  identity_event:
    intent: identity_change
    domain_hint: identity
    evidence_refs:
      - mandatory_behaviors

# ─────────────────────────────────────────────────────────────────────────────
# Correlation hints (deterministic defaults; per-family override exists above)
# ─────────────────────────────────────────────────────────────────────────────

correlation_hints:
  default_timespan: 5m
  default_group_by_mode: host
  default_correlation_type: temporal_ordered

# ─────────────────────────────────────────────────────────────────────────────
# Level translation — deterministic, used by LevelResolver.
# AI emits risk_bias ∈ {conservative, neutral, aggressive}; never the level itself.
# ─────────────────────────────────────────────────────────────────────────────

level_translation:
  base_by_vuln_type:
    rce: 4                # critical
    remote_code_execution: 4
    privilege_escalation: 4
    lpe: 4
    auth_bypass: 4
    authentication_bypass: 4
    sqli: 3               # high
    sql_injection: 3
    ssrf: 3
    rfi: 3
    lfi: 3
    file_upload: 3
    command_injection: 3
    path_traversal: 2     # medium
    information_disclosure: 1
    info_disclosure: 1
    default: 3            # high
  # Order: informational=0, low=1, medium=2, high=3, critical=4
  level_order: [informational, low, medium, high, critical]
  correlation_bump: 1
  risk_bias_offset:
    conservative: -1
    neutral: 0
    aggressive: +1
  feasibility_caps:
    lt_0.4: 0            # cap at informational
    between_0_4_and_0_7: 2   # cap at medium
    gt_0_7: 4            # no cap
  completeness_caps:
    incomplete: 1        # cap at low
    minimal: 2           # cap at medium
    full: 4

# ─────────────────────────────────────────────────────────────────────────────
# Completeness policy thresholds (Phase C)
# ─────────────────────────────────────────────────────────────────────────────

completeness_thresholds:
  min_fields_per_selection: 1
  min_evidence_backed_ratio: 0.5
  min_coverage_ratio: 0.3

# ─────────────────────────────────────────────────────────────────────────────
# Explanation text templates (Phase G — deterministic, no AI)
# ─────────────────────────────────────────────────────────────────────────────

explanation_templates:
  selection: "{domain} telemetry observes {intent} based on {evidence_ref}."
  condition: "Detection requires {operator_rendered}."
  correlation: "Sigma correlation rule joins sub-rules within {timespan}, grouped by {group_by}."
  limitation_feasibility: "Quality capped at {cap_level} because pipeline_feasibility = {feasibility:.2f}."
  limitation_completeness: "Detection completeness = {level}; some mandatory behaviors lack evidence-backed selections."
  fallback: "Falling back to rule-based planner because: {reason}."

# ─────────────────────────────────────────────────────────────────────────────
# Planner confidence thresholds
# ─────────────────────────────────────────────────────────────────────────────

planner_confidence:
  fallback_threshold: 0.4
  retry_threshold: 0.6