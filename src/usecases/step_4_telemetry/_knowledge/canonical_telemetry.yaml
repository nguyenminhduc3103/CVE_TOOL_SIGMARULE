version: 1

# Domain × execution_surface × vendor → Canonical Telemetry.
# Thêm entry mới khi có telemetry platform mới (vd GCP audit, ETW provider).
# KHÔNG cần sửa code.
canonical_telemetry:
  # ---- Windows ----
  - id: windows_security_audit
    domain: identity
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Security-Auditing"
    events: [4624, 4625, 4648, 4720, 4738, 4742, 4768, 4769]
    fields: [EventID, TargetUserName, SubjectUserName, TargetSid, SubjectUserSid, LogonType, IpAddress, SourceIp, DestinationIp, DestinationPort, ServiceName]
    coverage: high

  - id: sysmon_process
    domain: process
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Sysmon/Operational"
    events: [1, 3, 7, 11, 13, 22]
    fields: [Image, CommandLine, ParentImage, ParentCommandLine, User, IntegrityLevel, SourceIp, DestinationIp, DestinationPort]
    coverage: high

  - id: sysmon_dns
    domain: dns
    vendor: windows
    execution_surfaces: [server_side, client_side]
    log_path: "Microsoft-Windows-Sysmon/Operational"
    events: [22]
    fields: [QueryName, QueryStatus, QueryResults, Image]
    coverage: medium

  - id: windows_registry
    domain: registry
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Sysmon/Operational"
    events: [12, 13, 14]
    fields: [TargetObject, Details, Image]
    coverage: high

  - id: windows_filesystem
    domain: filesystem
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Sysmon/Operational"
    events: [11]
    fields: [TargetFilename, Image]
    coverage: high

  - id: windows_image_load
    domain: memory
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Sysmon/Operational"
    events: [7]
    fields: [ImageLoaded, Image, Signed, Signature, SignatureStatus]
    coverage: medium

  - id: windows_powershell
    domain: process
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-PowerShell/Operational"
    events: [4103, 4104]
    fields: [ScriptBlockText, ScriptBlockId, Path]
    coverage: medium

  # ---- Linux ----
  - id: auditd_linux
    domain: identity
    vendor: linux
    execution_surfaces: [server_side, local]
    log_path: "/var/log/audit/audit.log"
    events: [USER_AUTH, USER_LOGIN, USER_CMD]
    fields: [type, uid, acct, exe, hostname, addr]
    coverage: medium

  - id: sysmon_linux
    domain: process
    vendor: linux
    execution_surfaces: [server_side, client_side, local]
    log_path: "/var/log/syslog"
    events: [process_create]
    fields: [Image, CommandLine, ParentImage]
    coverage: medium

  # ---- Web (Apache/Nginx/IIS/Tomcat) ----
  - id: apache_access
    domain: http
    vendor: linux
    execution_surfaces: [server_side]
    log_path: "/var/log/apache2/access.log"
    events: [http_request]
    fields: [cs_method, cs_uri_stem, cs_uri_query, cs_user_agent, c_ip, sc_status]
    coverage: high

  - id: nginx_access
    domain: http
    vendor: linux
    execution_surfaces: [server_side]
    log_path: "/var/log/nginx/access.log"
    events: [http_request]
    fields: [request_method, request_uri, user_agent, remote_addr, status]
    coverage: high

  - id: iis_access
    domain: http
    vendor: windows
    execution_surfaces: [server_side]
    log_path: "IIS/AccessLog"
    events: [http_request]
    fields: [cs_method, cs_uri_stem, cs_uri_query, cs_user_agent, c_ip, sc_status]
    coverage: high

  # ---- Cloud ----
  - id: cloudtrail_aws
    domain: cloud
    vendor: aws
    execution_surfaces: [server_side, cloud]
    log_path: "CloudTrail"
    events: [CreateUser, AttachUserPolicy, ConsoleLogin, AssumeRole, PutBucketPolicy]
    fields: [eventName, userIdentity, sourceIPAddress, userAgent, requestParameters, responseElements]
    coverage: high

  - id: azure_signin_logs
    domain: identity
    vendor: azure
    execution_surfaces: [cloud, server_side]
    log_path: "AzureSignInLogs"
    events: [SignInLogs]
    fields: [operationName, properties.userPrincipalName, properties.ipAddress, properties.appDisplayName]
    coverage: high

  - id: azure_activity_logs
    domain: cloud
    vendor: azure
    execution_surfaces: [cloud, server_side]
    log_path: "AzureActivity"
    events: [ActivityLogs]
    fields: [operationName, properties, caller, level, status]
    coverage: medium

  # ---- Kubernetes / Container ----
  - id: kube_audit
    domain: kubernetes
    vendor: kubernetes
    execution_surfaces: [cloud, container]
    log_path: "kube-apiserver-audit"
    events: [create, update, delete, patch]
    fields: [verb, user.username, objectRef.resource, sourceIPs, requestURI]
    coverage: medium

  - id: docker_events
    domain: container
    vendor: linux
    execution_surfaces: [container, server_side]
    log_path: "/var/log/docker.log"
    events: [container_create, container_start, container_exec]
    fields: [Actor, Action, Type, name, status]
    coverage: low

  # ---- Office 365 ----
  - id: office365_audit
    domain: office
    vendor: m365
    execution_surfaces: [cloud, server_side]
    log_path: "OfficeActivity"
    events: [MailItemsAccessed, FileAccessed, Send, UpdateInboxRules]
    fields: [Operation, UserId, ClientIP, ResultStatus, ObjectId]
    coverage: medium

  # ---- Network IDS / Firewall ----
  - id: zeek_conn
    domain: network
    vendor: zeek
    execution_surfaces: [server_side, cloud, local]
    log_path: "/var/log/zeek/conn.log"
    events: [connection]
    fields: [id_orig_h, id_orig_p, id_resp_h, id_resp_p, proto, service]
    coverage: high

  - id: suricata_eve
    domain: network
    vendor: suricata
    execution_surfaces: [server_side, cloud]
    log_path: "/var/log/suricata/eve.json"
    events: [alert, http, dns, tls]
    fields: [src_ip, dest_ip, dest_port, proto, alert.signature]
    coverage: high

  - id: windows_firewall
    domain: network
    vendor: windows
    execution_surfaces: [server_side, client_side, local]
    log_path: "Microsoft-Windows-Windows Firewall With Advanced Security/Firewall"
    events: [2003, 2004, 2005]
    fields: [SourceAddress, DestinationAddress, DestinationPort, Protocol]
    coverage: medium