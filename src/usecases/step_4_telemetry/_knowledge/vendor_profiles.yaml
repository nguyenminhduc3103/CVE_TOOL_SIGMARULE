version: 1

# Vendor detection coverage matrix — dùng cho attacker_platforms inference
# và feasibility scoring.
vendors:
  windows:
    default_logging: [windows_security_audit, sysmon_process]
    coverage: high
  linux:
    default_logging: [auditd_linux, sysmon_linux]
    coverage: medium
  aws:
    default_logging: [cloudtrail_aws]
    coverage: high
  azure:
    default_logging: [azure_signin_logs, azure_activity_logs]
    coverage: medium
  gcp:
    default_logging: []
    coverage: low
  kubernetes:
    default_logging: [kube_audit]
    coverage: medium
  m365:
    default_logging: [office365_audit]
    coverage: medium
  zeek:
    default_logging: [zeek_conn]
    coverage: high
  suricata:
    default_logging: [suricata_eve]
    coverage: high