version: 1

# Canonical Field DB — engine-agnostic field names với backend aliases.
# AI emit canonical name OR any alias. Resolver sẽ check khớp.
canonical_fields:
  - canonical: target_user
    semantic: "Target account/user being acted upon"
    aliases: [TargetAccount, TargetUserName, user.target.name, TargetUser, AccountName]
    backends:
      sigma: TargetUserName
      ecs: user.target.name
      splunk: TargetUserName
      sentinel: TargetAccount

  - canonical: target_sid
    semantic: "Target security identifier (Windows SID)"
    aliases: [TargetSid, target.sid, targetSid]
    backends:
      sigma: TargetSid
      ecs: user.target.id
      splunk: TargetSid
      sentinel: TargetSid

  - canonical: source_user
    semantic: "User initiating the action"
    aliases: [SubjectAccount, SubjectUserName, user.name, SubjectUser]
    backends:
      sigma: SubjectUserName
      ecs: user.name
      splunk: SubjectUserName
      sentinel: SubjectAccount

  - canonical: subject_sid
    semantic: "Subject security identifier (Windows SID)"
    aliases: [SubjectUserSid, subject.sid, subjectSid, SubjectSid]
    backends:
      sigma: SubjectUserSid
      ecs: user.id
      splunk: SubjectSid
      sentinel: SubjectSid

  - canonical: service_name
    semantic: "Service name (Kerberos/LDAP/SMB/etc.)"
    aliases: [ServiceName, service.name, serviceName]
    backends:
      sigma: ServiceName
      ecs: service.name
      splunk: service_name
      sentinel: ServiceName

  - canonical: source_ip
    semantic: "Source IP address"
    aliases: [SourceIp, sourceIPAddress, src_ip, c_ip, SourceAddress, remote_addr, id_orig_h, src_ip_zeek]
    backends:
      sigma: SourceIp
      ecs: source.ip
      splunk: src_ip
      sentinel: SourceIP

  - canonical: destination_ip
    semantic: "Destination IP address"
    aliases: [DestinationIp, destinationIPAddress, dst_ip, dest_ip, id_resp_h]
    backends:
      sigma: DestinationIp
      ecs: destination.ip
      splunk: dst_ip
      sentinel: DestinationIP

  - canonical: destination_port
    semantic: "Destination port number"
    aliases: [DestinationPort, dest_port, id_resp_p, dst_port]
    backends:
      sigma: DestinationPort
      ecs: destination.port
      splunk: dst_port
      sentinel: DestinationPort

  - canonical: source_port
    semantic: "Source port number"
    aliases: [SourcePort, src_port, id_orig_p]
    backends:
      sigma: SourcePort
      ecs: source.port
      splunk: src_port
      sentinel: SourcePort

  - canonical: process_image
    semantic: "Process executable path/image"
    aliases: [Image, exe, process.executable, ImagePath, NewProcessName]
    backends:
      sigma: Image
      ecs: process.executable
      splunk: Image
      sentinel: ProcessName

  - canonical: command_line
    semantic: "Process command-line arguments"
    aliases: [CommandLine, cmd, process.command_line, ProcessArgs]
    backends:
      sigma: CommandLine
      ecs: process.command_line
      splunk: CommandLine
      sentinel: ProcessCommandLine

  - canonical: parent_image
    semantic: "Parent process image"
    aliases: [ParentImage, parent_process.executable, ParentProcessName]
    backends:
      sigma: ParentImage
      ecs: process.parent.executable
      splunk: ParentImage
      sentinel: ParentProcessName

  - canonical: event_id
    semantic: "Event ID (Windows Security / Sysmon EID)"
    aliases: [EventID, event.id, event_code, EventCode, EID]
    backends:
      sigma: EventID
      ecs: event.id
      splunk: EventCode
      sentinel: EventID

  - canonical: target_object
    semantic: "Registry key path being acted on"
    aliases: [TargetObject, registry.path, target.registry.path, RegistryKey]
    backends:
      sigma: TargetObject
      ecs: registry.path
      splunk: registry.path
      sentinel: RegistryKey

  - canonical: target_filename
    semantic: "File path being acted on"
    aliases: [TargetFilename, file.path, target.file.path, FileName, FilePath]
    backends:
      sigma: TargetFilename
      ecs: file.path
      splunk: file_path
      sentinel: FileName

  - canonical: hashes
    semantic: "File/process hashes (MD5/SHA1/SHA256)"
    aliases: [Hashes, hash, file.hash, process.hash, SHA256]
    backends:
      sigma: Hashes
      ecs: file.hash
      splunk: file_hash
      sentinel: SHA256

  - canonical: user_agent
    semantic: "HTTP User-Agent header"
    aliases: [UserAgent, user_agent, cs_user_agent, http.user_agent]
    backends:
      sigma: UserAgent
      ecs: user_agent.original
      splunk: http_user_agent
      sentinel: UserAgent

  - canonical: query_name
    semantic: "DNS query name"
    aliases: [QueryName, dns.question.name, query_name]
    backends:
      sigma: QueryName
      ecs: dns.question.name
      splunk: query_name
      sentinel: QueryName

  - canonical: logon_type
    semantic: "Windows logon type (2/3/4/8/9/10/11)"
    aliases: [LogonType, logon.type]
    backends:
      sigma: LogonType
      ecs: winlog.event_data.LogonType
      splunk: Logon_Type
      sentinel: LogonType

  - canonical: integrity_level
    semantic: "Process integrity level (Low/Medium/High/System)"
    aliases: [IntegrityLevel, process.integrity_level]
    backends:
      sigma: IntegrityLevel
      ecs: process.integrity_level
      splunk: IntegrityLevel
      sentinel: IntegrityLevel

  - canonical: request_uri
    semantic: "HTTP request URI"
    aliases: [cs_uri_stem, request_uri, url.path, requestURI]
    backends:
      sigma: cs-uri-stem
      ecs: url.path
      splunk: uri_path
      sentinel: RequestUri

  - canonical: script_block_text
    semantic: "PowerShell script block content"
    aliases: [ScriptBlockText, powershell.scriptblock, ScriptBlock]
    backends:
      sigma: ScriptBlockText
      ecs: powershell.file.script_block_text
      splunk: ScriptBlockText
      sentinel: ScriptBlockText